[package]
name = "executor"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
hkdf = "0.12"
hmac = "0.12"
ipnet = "2.12.0"
jsonschema = { version = "0.46.6", default-features = false }
libc = "0.2"
oxc = { version = "=0.137.0", default-features = false, features = [
  "semantic",
  "transformer",
  "codegen",
  "ast_visit",
] }
percent-encoding = "2"
rand = "0.8.5"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "=1.8.0", default-features = false }
rquickjs = { version = "=0.12.0", default-features = false, features = ["std", "futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio-rustls",
  "sqlite",
  "migrate",
  "macros",
] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "net",
  "signal",
  "time",
  "fs",
  "sync",
  "process",
  "io-util",
  "io-std",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
base64 = "0.22"
sha2 = "0.10"
